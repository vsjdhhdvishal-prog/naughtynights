<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard - Naughty Nights</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: #161616; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        h2 { color: #ff2a85; margin-bottom: 20px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #ccc; }
        .form-control { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
        .btn { background: #ff2a85; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 5px; }
        .btn-secondary { background: #333; margin-top: 10px; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; margin-top: 10px; border-radius: 6px; display: none; border: 1px solid #444; }
        .admin-prod-item { display: flex; justify-content: space-between; align-items: center; background: #202020; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .del-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2><i class="fa-solid fa-lock"></i> Store Admin Panel</h2>
        
        <!-- WhatsApp Settings -->
        <div class="form-group">
            <label>WhatsApp Number (e.g. 916262770811)</label>
            <input type="text" id="adminWa" class="form-control" placeholder="916262770811">
        </div>
        <button class="btn" onclick="saveWhatsApp()">Save WhatsApp Number</button>

        <hr style="border-color: #333; margin: 25px 0;">

        <!-- UPI & QR Code Gateway Settings -->
        <h2><i class="fa-solid fa-qrcode"></i> Payment & UPI Gateway Settings</h2>
        <div class="form-group">
            <label>Change UPI ID (e.g. yourname@paytm / ybl)</label>
            <input type="text" id="adminUpi" class="form-control" placeholder="newupi@handle">
        </div>
        <div class="form-group">
            <label>Upload New QR Code Image (From Gallery)</label>
            <input type="file" id="adminQrImage" class="form-control" accept="image/*" onchange="previewQrImage(event)">
            <img id="qrPreview" class="preview-img" alt="QR Preview">
        </div>
        <button class="btn" onclick="saveUpiSettings()">Save UPI & QR Settings</button>

        <hr style="border-color: #333; margin: 25px 0;">

        <!-- Add Product Section -->
        <h2><i class="fa-solid fa-box-open"></i> Add Product (10MB+ Gallery Support)</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="prodTitle" class="form-control" placeholder="Product Title">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="text" id="prodPrice" class="form-control" placeholder="₹1,499">
        </div>
        <div class="form-group">
            <label>Upload High-Res Picture</label>
            <input type="file" id="prodImage" class="form-control" accept="image/*" onchange="previewImage(event)">
            <img id="imgPreview" class="preview-img" alt="Preview">
        </div>
        <button class="btn" onclick="addProduct()">Publish Product</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">← Back To Store</button>

        <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <h3>Manage Products</h3>
            <div id="adminProductList" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        let base64Image = "";
        let base64Qr = "";

        window.addEventListener('DOMContentLoaded', () => {
            let savedWa = localStorage.getItem('store_wa');
            if(savedWa) document.getElementById('adminWa').value = savedWa;

            let savedUpi = localStorage.getItem('store_upi');
            if(savedUpi) document.getElementById('adminUpi').value = savedUpi;

            let savedQr = localStorage.getItem('store_qr');
            if(savedQr) {
                let preview = document.getElementById('qrPreview');
                preview.src = savedQr;
                preview.style.display = "block";
                base64Qr = savedQr;
            }

            renderAdminProducts();
        });

        function saveWhatsApp() {
            let num = document.getElementById('adminWa').value.trim();
            if(num) { 
                localStorage.setItem('store_wa', num); 
                alert("WhatsApp number saved successfully!"); 
            }
        }

        function saveUpiSettings() {
            let upi = document.getElementById('adminUpi').value.trim();
            if(upi) { 
                localStorage.setItem('store_upi', upi); 
            }
            if(base64Qr) {
                localStorage.setItem('store_qr', base64Qr);
            }
            alert("UPI ID and QR Code settings updated successfully!");
        }

        function previewQrImage(event) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    base64Qr = e.target.result;
                    let preview = document.getElementById('qrPreview');
                    preview.src = base64Qr;
                    preview.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        }

        function previewImage(event) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    let preview = document.getElementById('imgPreview');
                    preview.src = base64Image;
                    preview.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        }

        function addProduct() {
            let title = document.getElementById('prodTitle').value.trim();
            let price = document.getElementById('prodPrice').value.trim();
            if(!title || !price || !base64Image) { alert("Please fill all fields and select a picture!"); return; }

            let products = JSON.parse(localStorage.getItem('store_products')) || [];
            products.unshift({ title, price, image: base64Image });
            localStorage.setItem('store_products', JSON.stringify(products));

            document.getElementById('prodTitle').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodImage').value = "";
            document.getElementById('imgPreview').style.display = "none";
            base64Image = "";

            renderAdminProducts();
            alert("Product published successfully!");
        }

        function renderAdminProducts() {
            let products = JSON.parse(localStorage.getItem('store_products')) || [];
            let listDiv = document.getElementById('adminProductList');
            listDiv.innerHTML = products.length === 0 ? "<p style='color:#777; font-size:12px;'>No products found.</p>" : "";
            products.forEach((p, index) => {
                listDiv.innerHTML += `
                    <div class="admin-prod-item">
                        <span><b>${p.title}</b> (${p.price})</span>
                        <button class="del-btn" onclick="deleteProduct(${index})">Delete</button>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('store_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('store_products', JSON.stringify(products));
            renderAdminProducts();
        }
    </script>
</body>
</html>
